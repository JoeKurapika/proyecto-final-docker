version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: database_service
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cv_db
    # Elimina o comenta estas dos líneas para que no choque con tu PC:
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cv_network

  backend:
    image: espejo-backend:v1
    build: ./backend
    container_name: backend_service
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=cv_db
    depends_on:
      - database
    networks:
      - cv_network

  frontend:
    image: espejo-frontend:v1
    build: ./frontend
    container_name: frontend_service
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - cv_network

volumes:
  mysql_data:

networks:
  cv_network:
    driver: bridge